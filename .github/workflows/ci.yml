name: CI

# Bothost deploys straight from the repository, so a broken push is a broken
# production bot. This is the only gate between the two.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      - name: Logic smoke tests
        run: python scripts/smoke_logic.py
