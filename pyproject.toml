[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sssmlkyy-bot"
version = "1.0.0"
requires-python = ">=3.11"
# Mirrored from requirements.txt so Bothost `pip install .` / pyproject
# detection still gets runtime deps if it prefers pyproject over requirements.
dependencies = [
    "aiogram==3.29.1",
    "python-dotenv==1.1.0",
    "certifi==2025.6.15",
    "sqlalchemy==2.0.41",
    "greenlet==3.2.3",
    "aiosqlite==0.21.0",
    "asyncpg==0.30.0",
    "apscheduler==3.10.4",
    "tzdata==2026.3",
]

[tool.setuptools.packages.find]
include = [
    "app_logging*",
    "callbacks*",
    "config*",
    "db*",
    "domain*",
    "handlers*",
    "infrastructure*",
    "middlewares*",
    "presentation*",
    "services*",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["venv", "data", "logs"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes: unused imports/variables, dead names
    "E",
    "W",
    "I",   # import order
    "UP",  # outdated syntax for the target version
    "B",   # bugbear: mutable defaults, silent except, loop variable capture
    "SIM", # obvious simplifications
    "RUF",
]
ignore = [
    "B008",   # aiogram/FastAPI-style defaults in signatures are intentional
    "RUF001", # Cyrillic text is the product language, not a homoglyph attack
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts must extend sys.path (and smoke tests must set the
# environment) before importing the application packages.
"scripts/*" = ["E402"]
# Product copy: reflowing these strings would change what the client reads.
"presentation/texts/messages.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["main.py", "app_logging", "callbacks", "config", "db", "domain", "handlers", "infrastructure", "middlewares", "presentation", "services"]
exclude = "(venv|data|logs)"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
